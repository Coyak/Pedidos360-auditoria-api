# Configuración del Puerto del Servidor
server.port=${SERVER_PORT:8083}
spring.application.name=auditoria-api

# Conexión a Apache Kafka (Auditoría Transaccional)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.consumer.group-id=${KAFKA_AUDITORIA_GROUP_ID:auditoria-consumer-group}
spring.kafka.consumer.auto-offset-reset=earliest
pedidos360.kafka.topic.auditoria=${KAFKA_TOPIC_AUDITORIA:pedidos-auditoria-topic}
